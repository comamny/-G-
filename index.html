<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бот найден — Void Search</title>
<style>
:root{
    color-scheme: dark;
    --bg: #0b0b10;
    --panel: #111117;
    --panel2: #17171e;
    --line: #25252e;
    --muted: #56677f;
    --text: #e9edf5;
    --blue: #1a91c4; /* Изменено на новый цвет */
    --bluebg: #10232e;
    --green: #19c56b;
    --gold: #ffad13;
    --cyan: #1a91c4; /* Изменено на новый цвет */
    --btn-blue: #1a91c4; 
}

*{box-sizing:border-box}
html, body { height: 100%; }
body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background-image: radial-gradient(circle at 75% 30%, #0d161d 0%, var(--bg) 60%);
}

/* Контейнер карточки */
.card-container {
    width: 100%;
    max-width: 600px;
    margin: 20px;
    position: relative;
}

/* Основной стиль карточки */
.card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 15px;
    padding: 32px 36px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}

/* Левая декоративная полоска */
.card::before {
    content: '';
    position: absolute;
    top: 32px;
    left: 0;
    width: 4px;
    height: 32px;
    background-color: var(--blue);
    border-radius: 0 4px 4px 0;
    z-index: 2;
}

/* Верхняя метка */
.header-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 700;
    position: relative;
    z-index: 2;
}

.header-tag .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background-color: var(--cyan);
    display: inline-block;
}

/* Заголовок */
.title {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -0.6px;
    line-height: 1.1;
    margin: 0 0 16px;
    color: var(--text);
    position: relative;
    z-index: 2;
}

.title .highlight {
    color: var(--cyan);
}

/* Текст описания */
.description {
    color: #7e8ba0;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 24px;
    max-width: 90%;
    position: relative;
    z-index: 2;
}

.description .link {
    color: var(--cyan);
    text-decoration: none;
    font-weight: 600;
    transition: opacity 0.2s;
}

.description .link:hover {
    opacity: 0.8;
}

/* Разделитель */
.divider {
    width: 100%;
    height: 1px;
    background-color: var(--line);
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
}

/* Статус загрузки */
.status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 24px;
    position: relative;
    z-index: 2;
}

.status-line .spinner {
    width: 10px;
    height: 10px;
    border: 2px solid var(--line);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Кнопка */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--btn-blue);
    color: #ffffff;
    border: 1px solid var(--btn-blue);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    z-index: 2;
}

.btn:hover {
    background: var(--panel);
    color: var(--text);
    border-color: var(--line);
}

.btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
}

/* График глаза */
.decoration {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 220px;
    height: 220px;
    opacity: 0.15;
    pointer-events: none;
    z-index: 1;
}

.decoration path {
    fill: var(--cyan);
}

/* Адаптивность */
@media (max-width: 650px) {
    .card {
        padding: 24px 20px;
    }
    .card::before {
        top: 24px;
        height: 24px;
    }
    .title {
        font-size: 28px;
    }
    .description {
        max-width: 100%;
        font-size: 12px;
    }
    .btn {
        width: 100%;
    }
    .decoration {
        width: 160px;
        height: 160px;
        top: -15px;
        right: -15px;
        opacity: 0.1;
    }
}
</style>
</head>
